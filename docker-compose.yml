services:

  # PostgreSQL - Main application database
  postgres:
    image: postgres:17
    container_name: ramro_jutta_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ramro_jutta

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  # Redis - Cache and background jobs
  redis:
    image: redis:8
    container_name: ramro_jutta_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  # Meilisearch - Product search
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: ramro_jutta_meilisearch
    restart: unless-stopped

    environment:
      MEILI_NO_ANALYTICS: "true"

    ports:
      - "7700:7700"

    volumes:
      - meilisearch_data:/meili_data


  # MinIO - Local S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: ramro_jutta_minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ramro_jutta_dev_password

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


volumes:

  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data: